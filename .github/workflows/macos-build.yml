name: macOS build (Apple Silicon)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

env:
  FFMPEG_VERSION: "6.1.1"
  FFMPEG_URL: "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-arm64.gz"
  FFMPEG_SHA256: "8923876afa8db5585022d7860ec7e589af192f441c56793971276d450ed3bbfa"
  FPCALC_VERSION: "1.5.1"
  FPCALC_URL: "https://github.com/acoustid/chromaprint/releases/download/v1.5.1/chromaprint-fpcalc-1.5.1-macos-arm64.tar.gz"
  FPCALC_SHA256: "9c5d9565d2396dbcf0e1d797e1ffdf1e19242f3bed88ac3200e144286b57ede6"
  VLC_VERSION: "3.0.21"
  LIBDISCID_VERSION: "0.6.4"
  LIBDISCID_URL: "https://github.com/metabrainz/libdiscid/releases/download/v0.6.4/libdiscid-0.6.4.tar.gz"
  LIBDISCID_SHA256: "dd5e8f1c9aead442e23b749a9cc9336372e62e88ad7079a2b62895b0390cb282"
  PYTEST_FLOOR: "680"

jobs:
  build:
    runs-on: macos-14   # Apple Silicon (arm64)
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "arm64"
          cache: "pip"
          cache-dependency-path: requirements-build.txt

      - name: Confirm arm64 host and Python
        run: |
          hw=$(uname -m)
          py=$(python -c "import platform; print(platform.machine())")
          [ "$hw" = "arm64" ] || { echo "Host is $hw, expected arm64"; exit 1; }
          [ "$py" = "arm64" ] || { echo "Python reports $py — not arm64-native (Rosetta?)"; exit 1; }

      - name: Install Python dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run pytest gate
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if ! collect=$(python -m pytest --collect-only -q 2>&1); then
            printf '%s\n' "$collect"
            echo "pytest collection failed."
            exit 1
          fi
          count=$(printf '%s\n' "$collect" | sed -nE 's/^([0-9]+) tests? collected.*/\1/p' | head -n 1)
          [ -n "$count" ] || { printf '%s\n' "$collect"; echo "Could not determine collected test count from pytest output."; exit 1; }
          echo "Collected $count tests (floor $PYTEST_FLOOR)."
          [ "$count" -ge "$PYTEST_FLOOR" ] || { echo "Test count $count below floor $PYTEST_FLOOR"; exit 1; }
          python -m pytest -q

      - name: Cache vendor binaries
        uses: actions/cache@v4
        with:
          path: vendor-mac
          key: mac-vendor-ffmpeg${{ env.FFMPEG_VERSION }}-fpcalc${{ env.FPCALC_VERSION }}-vlc${{ env.VLC_VERSION }}-discid${{ env.LIBDISCID_VERSION }}-v1

      - name: Fetch and verify vendor binaries
        run: scripts/fetch-macos-vendor-binaries.sh

      - name: Build .icns icon
        run: scripts/build-macos-icon.sh

      - name: Write Last.fm API secrets
        env:
          LASTFM_KEY: ${{ secrets.LYON_LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LYON_LASTFM_API_SECRET }}
        run: |
          printf 'LASTFM_API_KEY = "%s"\nLASTFM_API_SECRET = "%s"\n' \
            "$LASTFM_KEY" "$LASTFM_SECRET" > lyon/core/_secrets.py

      - name: PyInstaller (arm64-only)
        run: python -m PyInstaller --noconfirm --target-arch arm64 build/lyon.spec

      - name: Inject libVLC, plugins, ffmpeg, fpcalc, libdiscid
        env:
          STAGED_VLC_DMG: vendor-mac/vlc.dmg
          STAGED_LIBDISCID_DYLIB: vendor-mac/libdiscid.0.dylib
          STAGED_FFMPEG: vendor-mac/ffmpeg
          STAGED_FPCALC: vendor-mac/fpcalc
        run: scripts/build-macos-bundle.sh

      - name: Detect macOS signing credentials
        id: macos-signing
        env:
          CERT_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -n "$CERT_P12" ] && [ -n "$CERT_PASSWORD" ] && \
             [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && \
             [ -n "$APPLE_APP_PASSWORD" ]; then
            echo "enabled=1" >> "$GITHUB_OUTPUT"
            echo "MACOS_SIGNING_ENABLED=1" >> "$GITHUB_ENV"
            echo "macOS signing credentials found; signed and notarized DMG will be produced."
          else
            echo "enabled=0" >> "$GITHUB_OUTPUT"
            echo "MACOS_SIGNING_ENABLED=0" >> "$GITHUB_ENV"
            echo "macOS signing credentials not configured; unsigned DMG will be produced."
          fi

      - name: Import signing certificate
        if: steps.macos-signing.outputs.enabled == '1'
        env:
          CERT_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: scripts/import-codesign-cert.sh

      - name: Codesign bundle
        if: steps.macos-signing.outputs.enabled == '1'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/codesign-macos-bundle.sh

      - name: Notarize and staple .app
        if: steps.macos-signing.outputs.enabled == '1'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/notarize-macos-app.sh

      - name: Build DMG
        env:
          MACOS_SIGNING_ENABLED: ${{ steps.macos-signing.outputs.enabled }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          brew install create-dmg
          scripts/build-macos-dmg.sh

      - name: Compute SHA256SUMS
        run: |
          ver=$(python -c "from lyon import __version__; print(__version__)")
          shasum -a 256 "dist/SeaLyonMediaManager-${ver}-arm64.dmg" \
              > "dist/SeaLyonMediaManager-${ver}-macos-SHA256SUMS.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeaLyonMediaManager-${{ github.ref_name }}-macos
          path: |
            dist/*.dmg
            dist/*-macos-SHA256SUMS.txt

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.dmg
            dist/*-macos-SHA256SUMS.txt

      - name: Generate multi-OS appcast.xml
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver=$(python -c "from lyon import __version__; print(__version__)")
          tag="v${ver}"
          repo="${{ github.repository }}"
          win_asset="SeaLyonMediaManager-${ver}-Setup.exe"
          mac_asset="SeaLyonMediaManager-${ver}-arm64.dmg"
          mac_path="dist/${mac_asset}"
          mac_size=$(stat -f%z "$mac_path")

          win_size=""
          for _ in {1..60}; do
            release_json=$(gh api "repos/${repo}/releases/tags/${tag}" 2>/dev/null || true)
            if [ -n "$release_json" ]; then
              win_size=$(printf '%s' "$release_json" | python -c '
          import json, sys
          name = sys.argv[1]
          try:
              data = json.load(sys.stdin)
          except json.JSONDecodeError:
              sys.exit(0)
          for asset in data.get("assets", []):
              if asset.get("name") == name:
                  print(asset.get("size", ""))
                  break
          ' "$win_asset")
            fi
            if [ -n "$win_size" ]; then
              break
            fi
            echo "Waiting for Windows installer asset ${win_asset} before generating appcast..."
            sleep 30
          done
          if [ -z "$win_size" ]; then
            echo "Timed out waiting for ${win_asset}; refusing to publish macOS appcast without Windows enclosure." >&2
            exit 1
          fi

          curl -fsSL \
            "https://drshoctopus.github.io/Sea-Lyon-Media-Manager/appcast.xml" \
            -o dist/appcast.xml || true
          python scripts/generate-appcast.py \
            --version "$ver" \
            --installer-url "https://github.com/${repo}/releases/download/${tag}/${win_asset}" \
            --installer-size "$win_size" \
            --macos-installer-url "https://github.com/${repo}/releases/download/${tag}/${mac_asset}" \
            --macos-installer-size "$mac_size" \
            --release-url "https://github.com/${repo}/releases/tag/${tag}" \
            --output dist/appcast.xml
          gh release upload "$tag" dist/appcast.xml --clobber
