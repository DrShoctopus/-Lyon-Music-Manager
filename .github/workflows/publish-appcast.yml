name: Publish appcast

on:
  release:
    types:
      - published

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish-appcast:
    name: Publish appcast to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out static Pages files
        uses: actions/checkout@v4

      - name: Download published release appcast
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p pages-content
          cp PRIVACY.md pages-content/PRIVACY.md
          gh release download "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern appcast.xml \
            --dir pages-content
          test -s pages-content/appcast.xml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-content

      - name: Deploy appcast to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
