name: Windows installer

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Fetch ffmpeg.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-extract
          $exe = Get-ChildItem -Path ffmpeg-extract -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName -Destination bin\ffmpeg.exe
          Remove-Item ffmpeg.zip
          Remove-Item -Recurse -Force ffmpeg-extract

      - name: Fetch libdiscid.dll
        shell: pwsh
        run: |
          $url = "https://github.com/metabrainz/libdiscid/releases/download/v0.6.4/libdiscid-0.6.4-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile libdiscid.zip
          Expand-Archive libdiscid.zip -DestinationPath libdiscid-extract
          $dll = Get-ChildItem -Path libdiscid-extract -Recurse -Filter discid.dll | Select-Object -First 1
          if (-not $dll) {
            $dll = Get-ChildItem -Path libdiscid-extract -Recurse -Filter libdiscid.dll | Select-Object -First 1
          }
          Copy-Item $dll.FullName -Destination bin\discid.dll
          Remove-Item libdiscid.zip
          Remove-Item -Recurse -Force libdiscid-extract

      - name: Smoke-test imports
        run: python -c "from lyon.app import main; print('imports OK')"

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm build/lyon.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\iscc.exe"
          }
          & $iscc installer\lyon.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LyonMusicManager-Setup
          path: installer/Output/LyonMusicManager-Setup.exe
          if-no-files-found: error
          retention-days: 30
