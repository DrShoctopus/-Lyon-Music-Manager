name: Windows build

on:
  workflow_dispatch:

env:
  FFMPEG_VERSION: "7.1.1"
  LIBDISCID_VERSION: "0.6.4"
  VLC_VERSION: "3.0.21"
  # Pin Chromaprint/fpcalc to a known good Windows x86_64 release. Bump
  # alongside any verified upgrade; do not auto-resolve "latest" from
  # GitHub's API or builds become non-reproducible.
  CHROMAPRINT_VERSION: "1.5.1"
  FPCALC_ARCHIVE: "chromaprint-fpcalc-1.5.1-windows-x86_64.zip"
  FPCALC_URL: "https://github.com/acoustid/chromaprint/releases/download/v1.5.1/chromaprint-fpcalc-1.5.1-windows-x86_64.zip"
  # Test-collection floor. Bump when adding tests; never silently drop.
  PYTEST_FLOOR: "645"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run pytest gate
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          # Collection floor: refuse to package if test count drops.
          $collect = & python -m pytest --collect-only -q 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host $collect
            throw "pytest collection failed."
          }
          $countLine = $collect | Select-String -Pattern '^(\d+) tests collected' | Select-Object -First 1
          if (-not $countLine) {
            throw "Could not determine collected test count from pytest output."
          }
          $count = [int]($countLine.Matches[0].Groups[1].Value)
          $floor = [int]$env:PYTEST_FLOOR
          if ($count -lt $floor) {
            throw "Pytest collected $count tests, below the floor of $floor. Update PYTEST_FLOOR only after intentionally removing tests."
          }
          Write-Host "Collected $count tests (floor $floor)."
          # Run the suite.
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw "pytest run failed; aborting before packaging." }

      - name: Cache binary runtimes
        id: cache-bins
        uses: actions/cache@v4
        with:
          path: bin
          key: windows-bins-ffmpeg-${{ env.FFMPEG_VERSION }}-discid-${{ env.LIBDISCID_VERSION }}-vlc-${{ env.VLC_VERSION }}-chromaprint-${{ env.CHROMAPRINT_VERSION }}

      - name: Fetch ffmpeg.exe (hash-verified)
        if: steps.cache-bins.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          $archive = "ffmpeg-release-essentials.zip"
          $url = "https://www.gyan.dev/ffmpeg/builds/$archive"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip -UseBasicParsing
          $checksum = Invoke-WebRequest -Uri "$url.sha256" -UseBasicParsing
          $contentType = [string]$checksum.Headers['Content-Type']
          if ($contentType -match 'text/html') { throw "ffmpeg checksum URL returned HTML." }
          $expected = $null
          foreach ($line in ($checksum.Content -split "`r?`n")) {
            if ($line -match '^\s*([A-Fa-f0-9]{64})\s+[* ]?(.+?)\s*$' -and [System.IO.Path]::GetFileName($Matches[2]) -eq $archive) {
              $expected = $Matches[1].ToLowerInvariant(); break
            }
            if ($line -match '([A-Fa-f0-9]{64})') {
              $expected = $Matches[1].ToLowerInvariant()
            }
          }
          if (-not $expected) { throw "No SHA-256 found in $url.sha256" }
          $actual = (Get-FileHash -Algorithm SHA256 ffmpeg.zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "ffmpeg.zip SHA-256 mismatch: expected $expected, got $actual" }
          Write-Host "Verified ffmpeg.zip SHA-256: $actual"
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-extract
          $exe = Get-ChildItem -Path ffmpeg-extract -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw "ffmpeg.exe was not found in the downloaded archive." }
          Copy-Item $exe.FullName -Destination bin\ffmpeg.exe -Force
          Remove-Item ffmpeg.zip
          Remove-Item -Recurse -Force ffmpeg-extract

      - name: Fetch libdiscid.dll (hash-verified)
        if: steps.cache-bins.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $archive = "libdiscid-${{ env.LIBDISCID_VERSION }}-win.zip"
          $checksumUrl = "https://ftp.musicbrainz.org/pub/musicbrainz/libdiscid/libdiscid-${{ env.LIBDISCID_VERSION }}.SHA256SUMS"
          $urls = @(
            "https://github.com/metabrainz/libdiscid/releases/download/v${{ env.LIBDISCID_VERSION }}/$archive",
            "https://ftp.musicbrainz.org/pub/musicbrainz/libdiscid/$archive",
            "https://ftp.osuosl.org/pub/musicbrainz/libdiscid/$archive"
          )
          $zip = "libdiscid.zip"
          $checksum = Invoke-WebRequest -Uri $checksumUrl -UseBasicParsing
          $expected = $null
          foreach ($line in ($checksum.Content -split "`r?`n")) {
            if ($line -match '^\s*([A-Fa-f0-9]{64})\s+[* ]?(.+?)\s*$' -and [System.IO.Path]::GetFileName($Matches[2]) -eq $archive) {
              $expected = $Matches[1].ToLowerInvariant(); break
            }
          }
          if (-not $expected) { throw "No SHA-256 for $archive in $checksumUrl" }
          $ok = $false
          foreach ($u in $urls) {
            try {
              Write-Host "Trying $u"
              Invoke-WebRequest -Uri $u -OutFile $zip -UseBasicParsing -ErrorAction Stop
              $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
              if ($actual -ne $expected) { throw "$u SHA-256 mismatch: expected $expected, got $actual" }
              Write-Host "Verified $archive SHA-256: $actual"
              $ok = $true
              break
            } catch {
              Write-Host "  -> $($_.Exception.Message)"
            }
          }
          if (-not $ok) { throw "Could not fetch + verify libdiscid from any source." }
          Expand-Archive $zip -DestinationPath libdiscid-extract -Force
          $dll = Get-ChildItem -Path libdiscid-extract -Recurse -Filter discid.dll |
                   Where-Object { $_.FullName -match '64' } | Select-Object -First 1
          if (-not $dll) {
            $dll = Get-ChildItem -Path libdiscid-extract -Recurse -Filter discid.dll | Select-Object -First 1
          }
          if (-not $dll) {
            $dll = Get-ChildItem -Path libdiscid-extract -Recurse -Filter libdiscid.dll | Select-Object -First 1
          }
          if (-not $dll) { throw "Archive contained no discid.dll / libdiscid.dll." }
          Copy-Item $dll.FullName -Destination bin\discid.dll -Force
          Remove-Item $zip
          Remove-Item -Recurse -Force libdiscid-extract

      - name: Fetch fpcalc.exe (pinned version, runtime-verified)
        if: steps.cache-bins.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Invoke-WebRequest -Uri "${{ env.FPCALC_URL }}" -OutFile fpcalc.zip -UseBasicParsing
          Expand-Archive fpcalc.zip -DestinationPath fpcalc-extract -Force
          $exe = Get-ChildItem -Path fpcalc-extract -Recurse -Filter fpcalc.exe | Select-Object -First 1
          if (-not $exe) { throw "fpcalc.exe was not found in ${{ env.FPCALC_ARCHIVE }}." }
          Copy-Item $exe.FullName -Destination bin\fpcalc.exe -Force
          $versionOutput = & bin\fpcalc.exe -version 2>&1
          if ($LASTEXITCODE -ne 0) { throw "fpcalc.exe -version failed: $versionOutput" }
          if ($versionOutput -notmatch [regex]::Escape("${{ env.CHROMAPRINT_VERSION }}")) {
            throw "Expected fpcalc ${{ env.CHROMAPRINT_VERSION }}, got: $versionOutput"
          }
          Remove-Item fpcalc.zip
          Remove-Item -Recurse -Force fpcalc-extract

      - name: Fetch libVLC runtime (hash-verified)
        if: steps.cache-bins.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $archive = "vlc-${{ env.VLC_VERSION }}-win64.zip"
          $url = "https://download.videolan.org/pub/videolan/vlc/${{ env.VLC_VERSION }}/win64/$archive"
          Invoke-WebRequest -Uri $url -OutFile vlc.zip -UseBasicParsing
          $checksum = Invoke-WebRequest -Uri "$url.sha256" -UseBasicParsing
          $expected = $null
          foreach ($line in ($checksum.Content -split "`r?`n")) {
            if ($line -match '^\s*([A-Fa-f0-9]{64})\s+[* ]?(.+?)\s*$' -and [System.IO.Path]::GetFileName($Matches[2]) -eq $archive) {
              $expected = $Matches[1].ToLowerInvariant(); break
            }
            if ($line -match '([A-Fa-f0-9]{64})') {
              $expected = $Matches[1].ToLowerInvariant()
            }
          }
          if (-not $expected) { throw "No SHA-256 found in $url.sha256" }
          $actual = (Get-FileHash -Algorithm SHA256 vlc.zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "vlc.zip SHA-256 mismatch: expected $expected, got $actual" }
          Write-Host "Verified vlc.zip SHA-256: $actual"
          Expand-Archive vlc.zip -DestinationPath vlc-extract -Force
          $root = Get-ChildItem -Path vlc-extract -Directory | Select-Object -First 1
          if (-not $root) { throw "VLC archive did not contain an extracted root directory." }
          $vlcOut = "bin\vlc"
          New-Item -ItemType Directory -Force -Path $vlcOut | Out-Null
          Copy-Item -Path (Join-Path $root.FullName 'libvlc.dll') -Destination $vlcOut -Force
          Copy-Item -Path (Join-Path $root.FullName 'libvlccore.dll') -Destination $vlcOut -Force
          Copy-Item -Path (Join-Path $root.FullName 'plugins') -Destination $vlcOut -Recurse -Force
          if (-not (Test-Path (Join-Path $vlcOut 'libvlc.dll'))) { throw "libvlc.dll was not copied to bin\vlc." }
          if (-not (Test-Path (Join-Path $vlcOut 'libvlccore.dll'))) { throw "libvlccore.dll was not copied to bin\vlc." }
          if (-not (Test-Path (Join-Path $vlcOut 'plugins'))) { throw "VLC plugins directory was not copied to bin\vlc." }
          Remove-Item vlc.zip
          Remove-Item -Recurse -Force vlc-extract

      - name: Smoke-test imports
        shell: pwsh
        run: |
          $env:PATH = "${{ github.workspace }}\bin\vlc;$env:PATH"
          $env:VLC_PLUGIN_PATH = "${{ github.workspace }}\bin\vlc\plugins"
          python -c "from lyon.app import main; print('imports OK')"
          python -c "from PySide6.QtCore import QCoreApplication; app = QCoreApplication([]); from lyon.core.playback_backend import create_playback_backend; backend = create_playback_backend(); print(type(backend).__name__); assert type(backend).__name__ == 'VlcPlaybackBackend'"
          python -c "from lyon.core.fingerprint import is_available; assert is_available(); print('fpcalc OK')"

      - name: Validate PyInstaller inputs
        shell: pwsh
        run: |
          foreach ($required in @('main.py', 'docs\brand\lyon-app-icon.png', 'bin\ffmpeg.exe', 'bin\fpcalc.exe')) {
            if (-not (Test-Path $required)) {
              throw "Required build input missing: $required"
            }
          }

      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm build/lyon.spec

      - name: Verify packaged VLC runtime
        shell: pwsh
        run: |
          $bundleVlc = "dist\LyonMusicManager\_internal\bin\vlc"
          if (-not (Test-Path $bundleVlc)) {
            $bundleVlc = "dist\LyonMusicManager\bin\vlc"
          }
          if (-not (Test-Path (Join-Path $bundleVlc 'libvlc.dll'))) { throw "Packaged app is missing libvlc.dll." }
          if (-not (Test-Path (Join-Path $bundleVlc 'libvlccore.dll'))) { throw "Packaged app is missing libvlccore.dll." }
          if (-not (Test-Path (Join-Path $bundleVlc 'plugins'))) { throw "Packaged app is missing VLC plugins." }
          $bundleBin = "dist\LyonMusicManager\_internal\bin"
          if (-not (Test-Path $bundleBin)) {
            $bundleBin = "dist\LyonMusicManager\bin"
          }
          if (-not (Test-Path (Join-Path $bundleBin 'fpcalc.exe'))) { throw "Packaged app is missing fpcalc.exe." }

      - name: Zip dist folder
        shell: pwsh
        run: Compress-Archive -Path dist\LyonMusicManager\* -DestinationPath LyonMusicManager-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LyonMusicManager-windows
          path: LyonMusicManager-windows.zip
          if-no-files-found: error
          retention-days: 30
