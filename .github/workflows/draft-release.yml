name: Create Draft Release

on:
  push:
    branches:
      - release/1.0.1
    paths:
      - .github/workflows/draft-release.yml

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create v1.0.1 draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.1 \
            --repo "$GITHUB_REPOSITORY" \
            --title "v1.0.1" \
            --generate-notes \
            --draft \
            --target release/1.0.1
